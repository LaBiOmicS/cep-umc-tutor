[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cep-umc-tutor"
version = "0.2.0"
description = "Tutor de pré-submissão ao CEP-UMC (Claude Code e Antigravity): ética e documentos (Trilha A) e sugestões acadêmicas por nível (Trilha B)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prof. Dr. Fabiano Bezerra Menegidio", email = "fabianomenegidio@umc.br" }
]
keywords = ["research-ethics", "cep", "conep", "plataforma-brasil", "tcle", "claude-code", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
extract = ["pypdf>=4.0.0", "olefile>=0.47"]
report = ["reportlab>=4.0.0"]
all = ["pypdf>=4.0.0", "olefile>=0.47", "reportlab>=4.0.0"]

[project.urls]
Homepage = "https://github.com/LaBiOmicS/cep-umc-tutor"
Repository = "https://github.com/LaBiOmicS/cep-umc-tutor.git"
Issues = "https://github.com/LaBiOmicS/cep-umc-tutor/issues"

[tool.hatch.build.targets.wheel]
packages = ["skills"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pypdf>=4.0.0",
    "olefile>=0.47",
    "reportlab>=4.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 160
src = ["skills/cep-tutor/scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
